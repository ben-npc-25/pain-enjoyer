# XcodeGen spec — generates PainEnjoyer.xcodeproj on a Mac:
#   brew install xcodegen && cd ios && xcodegen
# (.xcodeproj is gitignored; this file is the source of truth.)
name: PainEnjoyer
options:
  bundleIdPrefix: com.benng
  deploymentTarget:
    iOS: "17.0"
targets:
  PainEnjoyer:
    type: application
    platform: iOS
    sources: [PainEnjoyer]
    entitlements:
      path: PainEnjoyer/PainEnjoyer.entitlements
      properties:
        com.apple.developer.healthkit: true
        # M1: lets iOS wake the app when new workouts land in Health
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Pain Enjoyer reads your runs and recovery metrics from Health to
          coach your marathon training.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        # Ben's free personal team "ben Ng" (cert OU, NOT the parenthetical in the
        # cert name). Team IDs aren't secret; pinning it survives xcodegen regens.
        DEVELOPMENT_TEAM: 4YC3X253S5
        PRODUCT_BUNDLE_IDENTIFIER: com.benng.painenjoyer
